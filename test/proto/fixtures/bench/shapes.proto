edition = "2024";

package fixtures.bench;

option java_package = "com.acme.fixtures.bench";

// Message archetypes for the representation benchmark. Real payloads differ
// enormously in shape, and the map-vs-record trade-off does not behave the same
// across them — a flat scalar message is dominated by per-field overhead, while
// a deeply nested one is dominated by allocation.

// 12 scalars, no nesting. Worst case for per-field overhead.
message Flat {
  string f1 = 1;
  string f2 = 2;
  string f3 = 3;
  int32 f4 = 4;
  int32 f5 = 5;
  int64 f6 = 6;
  int64 f7 = 7;
  bool f8 = 8;
  bool f9 = 9;
  double f10 = 10;
  double f11 = 11;
  string f12 = 12;
}

// Three fields. Best case for per-message overhead to show up.
message Tiny {
  string id = 1;
  int32 n = 2;
  bool ok = 3;
}

// Four levels of nesting. Stresses recursive construction and allocation.
message Deep {
  string id = 1;
  Level2 child = 2;
}
message Level2 {
  string id = 1;
  Level3 child = 2;
}
message Level3 {
  string id = 1;
  Level4 child = 2;
}
message Level4 {
  string id = 1;
  string leaf = 2;
}

// One wide repeated field. Stresses the repeated path, not the field loop.
message WideRepeated {
  string id = 1;
  repeated string items = 2;
}

// Repeated submessages — the common "list of rows" shape.
message RepeatedMessages {
  string id = 1;
  repeated Tiny rows = 2;
}

// A map field. Stresses entry-builder construction.
message MapHeavy {
  string id = 1;
  map<string, int32> counts = 2;
}

// Enum-dense. The other shapes never touch an enum, and enum coercion has its
// own cost profile: name lookups on the way in, descriptor-to-keyword on the
// way out. The repeated field stays on the reflection path by design.
enum Status {
  STATUS_UNSPECIFIED = 0;
  STATUS_ACTIVE = 1;
  STATUS_PAUSED = 2;
  STATUS_CLOSED = 3;
}
message EnumHeavy {
  string id = 1;
  Status s1 = 2;
  Status s2 = 3;
  Status s3 = 4;
  Status s4 = 5;
  Status s5 = 6;
  Status s6 = 7;
  Status s7 = 8;
  Status s8 = 9;
  repeated Status history = 10;
}

// A production-shaped payload: a reply wrapping a body-bearing message and a
// list of line items. This is the one shape here sized like real traffic, and
// it exists because every other shape in this file conflates the two terms
// that dominate at ~1 KB. Driven from the bench two ways over the SAME wire
// size: `realistic` puts its bulk in one filler string, `dense` spreads the
// same byte count across four times the fields. Same bytes, 30 leaves against
// 120, so the per-field and per-byte terms separate instead of moving together.
//
// Shape copied from clj-grpc's soak payload (bench/clj_grpc/soak/payload.clj)
// so the two corpora's tables can sit side by side without a conversion step.
message Reply {
  string name = 1;
  Payload payload = 2;
}
message Payload {
  string id = 1;
  string title = 2;
  string body = 3;
  int64 created_at = 4;
  double score = 5;
  repeated Item items = 6;
}
message Item {
  string sku = 1;
  int32 qty = 2;
  double price = 3;
}
